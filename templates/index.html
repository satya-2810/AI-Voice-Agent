<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lady Victoria — Voice Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css?v=2" />
  </head>
  <body>
    <div class="app-container">
      <div class="glass-card">
        <section class="screen" id="screenSetup">
          <div class="header-section">
            <p class="eyebrow">Lady Victoria</p>
            <h1 class="title">Your Royal Butler</h1>
            <p class="subtitle">
              Before we begin, kindly provide the keys needed to bring the
              household service online.
            </p>
          </div>

          <div class="key-form">
            <label class="key-label" for="geminiKey">Gemini API key</label>
            <input type="password" id="geminiKey" placeholder="Required" />

            <label class="key-label" for="murfKey">Murf API key</label>
            <input type="password" id="murfKey" placeholder="Required" />

            <label class="key-label" for="assemblyKey">AssemblyAI API key</label>
            <input type="password" id="assemblyKey" placeholder="Required" />

            <label class="key-label" for="tavilyKey">Tavily API key</label>
            <input type="password" id="tavilyKey" placeholder="Optional — enables live search" />

            <button class="btn primary full" id="saveKeysBtn">Save keys</button>
            <p class="form-note" id="setupNote"></p>
          </div>
        </section>
      </div>
    </div>

    <script src="/static/setup.js?v=1" defer></script>
  </body>
</html>
